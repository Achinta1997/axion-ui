trigger: none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: buildAxionUI
    displayName: Build UI
    jobs:
      - job: buildJob
        steps:
        - task: Docker@2
          inputs:
            containerRegistry: 'axion'
            repository: 'achinta1/axion'
            command: 'buildAndPush'
            Dockerfile: '**/Dockerfile'
